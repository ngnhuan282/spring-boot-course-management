name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      T9_COMPOSE_PROJECT: task9-ci-${{ github.run_id }}-${{ github.run_attempt }}
      T9_MYSQL_PORT: '13309'
      T9_REDIS_PORT: '16379'
      T9_JDBC_URL: jdbc:mysql://127.0.0.1:13309/task09_cache?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      T9_DB_USER: task09_user
      T9_DB_PASSWORD: task09_local_password
      T9_REDIS_HOST: 127.0.0.1
      T9_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      T9_SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start Task 9 MySQL and Redis
        run: >-
          docker compose -p "$T9_COMPOSE_PROJECT" -f ../docs/task9/compose.task9.yml
          up -d --wait --wait-timeout 300

      - name: Build and run tests
        run: >-
          sh ./mvnw -B
          -Djunit.jupiter.execution.parallel.enabled=false
          "-Dtask9.evidence.directory=$RUNNER_TEMP/task9-evidence/scenarios"
          verify

      - name: Collect Task 9 service logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/task9-evidence"
          docker compose -p "$T9_COMPOSE_PROJECT" -f ../docs/task9/compose.task9.yml ps -a > "$RUNNER_TEMP/task9-evidence/services.log" 2>&1
          docker compose -p "$T9_COMPOSE_PROJECT" -f ../docs/task9/compose.task9.yml logs --no-color > "$RUNNER_TEMP/task9-evidence/containers.log" 2>&1

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
          if-no-files-found: warn

      - name: Save Task 9 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task9-evidence
          path: ${{ runner.temp }}/task9-evidence/
          if-no-files-found: warn

      - name: Stop Task 9 MySQL and Redis
        if: always()
        run: >-
          docker compose -p "$T9_COMPOSE_PROJECT" -f ../docs/task9/compose.task9.yml
          down --volumes
