name: Standalone CI and CD

on:
  push:
    branches:
      - docker-standalone
      - refactor/course-standalone
      - 'lab/standalone-ci-*'
  pull_request:
    branches:
      - refactor/course-standalone

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test
        working-directory: backend
        run: sh ./mvnw -B verify
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-test-reports
          path: backend/target/surefire-reports/*.xml
          if-no-files-found: error

  docker-one-command:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: c8s-ci-${{ github.run_id }}-${{ github.run_attempt }}
      STANDALONE_SOURCE_REVISION: ${{ github.sha }}
      STANDALONE_IMAGE_REF: course-standalone-backend:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record fresh project and volume
        run: >-
          python scripts/standalone/verify_runtime.py --phase preflight
          --project "$COMPOSE_PROJECT_NAME" --expected-revision "$GITHUB_SHA"
          --output c8-runtime
      - name: Build and start all three services with one command
        run: |
          set -euo pipefail
          printf '%s\n' 'docker compose -f docker-compose.standalone.yml up --build -d --wait --wait-timeout 600' > c8-runtime/startup-command.txt
          docker compose -f docker-compose.standalone.yml up --build -d --wait --wait-timeout 600 2>&1 | tee c8-runtime/startup.log
      - name: Verify Flyway API database cache and restart
        run: >-
          python scripts/standalone/verify_runtime.py --phase verify
          --project "$COMPOSE_PROJECT_NAME" --expected-revision "$GITHUB_SHA"
          --output c8-runtime
      - name: Capture runtime logs
        if: always()
        run: |
          mkdir -p c8-runtime
          docker compose -f docker-compose.standalone.yml ps -a > c8-runtime/containers.txt
          docker compose -f docker-compose.standalone.yml logs --no-color > c8-runtime/containers.log
      - name: Seal captured files
        if: always()
        run: >-
          python scripts/standalone/verify_runtime.py --phase seal
          --project "$COMPOSE_PROJECT_NAME" --expected-revision "$GITHUB_SHA"
          --output c8-runtime
      - name: Save one-command Docker proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-docker-proof
          path: c8-runtime/
          if-no-files-found: error
      - name: Stop this temporary project
        if: always()
        run: docker compose -f docker-compose.standalone.yml down

  deliver-ghcr:
    needs: [build-and-test, docker-one-command]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/docker-standalone' || github.ref == 'refs/heads/refactor/course-standalone')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: c8s-cd-${{ github.run_id }}-${{ github.run_attempt }}
      STANDALONE_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Name the standalone image
        id: image
        run: |
          set -euo pipefail
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}-standalone" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Publish tested source to GHCR
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Select the published digest
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "STANDALONE_IMAGE_REF=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
      - name: Record fresh CD project and volume
        run: >-
          python scripts/standalone/verify_runtime.py --phase preflight
          --project "$COMPOSE_PROJECT_NAME" --expected-revision "$GITHUB_SHA"
          --output c8-delivery
      - name: Deploy published image on the temporary runner
        run: |
          set -euo pipefail
          printf '%s\n' 'docker compose -f docker-compose.standalone.yml up --no-build --pull always -d --wait --wait-timeout 600' > c8-delivery/startup-command.txt
          docker compose -f docker-compose.standalone.yml up --no-build --pull always -d --wait --wait-timeout 600 2>&1 | tee c8-delivery/startup.log
      - name: Verify the delivered digest and runtime
        run: >-
          python scripts/standalone/verify_runtime.py --phase verify
          --project "$COMPOSE_PROJECT_NAME" --expected-revision "$GITHUB_SHA"
          --delivery-image "$STANDALONE_IMAGE_REF" --output c8-delivery
      - name: Write delivery summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('c8-delivery/delivery-metadata.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Course standalone delivery\n\n')
              f.write('Commit: `' + m['source_sha'] + '`\n\n')
              f.write('Image: `' + m['image_ref'] + '`\n\n')
              f.write('GHCR publication and temporary runner deployment verified.\n')
          PY
      - name: Capture delivery logs
        if: always()
        run: |
          mkdir -p c8-delivery
          docker compose -f docker-compose.standalone.yml ps -a > c8-delivery/containers.txt
          docker compose -f docker-compose.standalone.yml logs --no-color > c8-delivery/containers.log
      - name: Seal delivery files
        if: always()
        run: >-
          python scripts/standalone/verify_runtime.py --phase seal
          --project "$COMPOSE_PROJECT_NAME" --expected-revision "$GITHUB_SHA"
          --output c8-delivery
      - name: Save CD evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-delivery-proof
          path: c8-delivery/
          if-no-files-found: error
      - name: Stop this temporary deployment
        if: always()
        run: docker compose -f docker-compose.standalone.yml down
