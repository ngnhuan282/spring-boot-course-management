# Separate empty MySQL database for the M11 migration evidence run.
spring:
  datasource:
    url: ${M11_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3308/course_management_m11_migration}
    username: ${M11_DATASOURCE_USERNAME:course_user}
    password: ${M11_DATASOURCE_PASSWORD:course_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  cache:
    type: none

server:
  port: 8083
