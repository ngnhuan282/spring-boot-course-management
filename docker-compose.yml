services:
  postgres:
    image: postgres:16-alpine
    container_name: course-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_management}
      POSTGRES_USER: ${POSTGRES_USER:-course_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - course_management_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  course_management_postgres_data:
